name: Rayo Delivery — CI Pipeline Firebase Emulator Suite

on:
  push:
    branches: [ main, develop, staging ]
  pull_request:
    branches: [ main, develop, staging ]
  workflow_dispatch:

# Permisos mínimos y restrictivos (solo lectura de código)
permissions:
  contents: read

# Variables de entorno estrictamente aisladas para pruebas (demo-rayo-test)
env:
  NODE_ENV: test
  RAYO_TEST_ENV: 'true'
  FIREBASE_PROJECT_ID: demo-rayo-test
  GCLOUD_PROJECT: demo-rayo-test
  FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
  FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
  CI: 'true'

jobs:
  firebase-emulator-validation:
    name: Firebase Emulator & Rules Validation (Isolated Sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java Installation
        run: |
          echo "=== OpenJDK 17 Verification ==="
          java -version

      - name: Install Project Dependencies
        run: npm ci

      - name: Install Firebase Tools CLI
        run: npm install -g firebase-tools

      - name: Verify Firebase CLI Version
        run: |
          echo "=== Firebase CLI Verification ==="
          firebase --version

      - name: Strict Isolation & Security Verification
        run: |
          echo "=== Checking CI Isolation Guarantees ==="
          npx tsx scripts/verify-ci-isolation.ts

      - name: Verify Staging Builds (clientes, repartidores, admin)
        run: |
          echo "=== Building Multi-target Applications ==="
          npm run build:all

      - name: Run Staging & Graceful Shutdown Unit Suite
        run: |
          echo "=== Executing Staging Unit & Mock Suites ==="
          npm run test:staging

      - name: Execute Real Firebase Emulator Suite (Firestore & Auth)
        run: |
          echo "=== Starting Firebase Emulator Suite with demo-rayo-test ==="
          firebase emulators:exec \
            --only firestore,auth \
            --project demo-rayo-test \
            "npx tsx --test tests/real-emulator-suite.test.ts"

      - name: Archive Emulator Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-emulator-debug-logs
          path: |
            *.log
            firestore-debug.log
            ui-debug.log
          retention-days: 7

      - name: Confirm Pipeline Success
        if: success()
        run: |
          echo "========================================================="
          echo "🎉 PIPELINE CI: VALIDACIÓN DE EMULADORES COMPLETADA CON ÉXITO"
          echo "Proyecto: demo-rayo-test"
          echo "Emuladores: Firestore (127.0.0.1:8080) & Auth (127.0.0.1:9099)"
          echo "Reglas de seguridad y checkout validados correctamente"
          echo "========================================================="
